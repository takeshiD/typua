[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.2.0"
rust-version = "1.94"
repository = "https://github.com/takeshid/typua"
authors = ["tkcd<goriponikeike55@gmail.com>"]
license = "MIT"

[workspace.dependencies]
# internal dependencies
typua_syntax = { path = "crates/typua_syntax" }
typua_types = { path = "crates/typua_types" }
typua_cli = { path = "crates/typua_cli" }
typua_config = { path = "crates/typua_config" }
# typua_vfs = { path = "crates/typua_vfs" }

# external dependencies
## for release
anyhow = "1"
clap = { version = "4", features = ["derive"] }
full_moon = { version = "2", features = ["luajit"] }
indexmap = "2.12"
itertools = "0.14"
nom = "8.0.0"
nom_locate = "5.0.0"
rustc-hash = "2.1"
serde = "1.0"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-macros = "2.6"
tower-lsp-server = "0.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

## for development
unindent = "0.2"
pretty_assertions = "1.4"
